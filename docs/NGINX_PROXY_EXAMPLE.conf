# RuoYi-Cpp Nginx 反向代理示例配置
# 复制到 /etc/nginx/conf.d/ruoyi-cpp.conf（Linux）或 nginx/conf/（Windows）

# ── HTTP → HTTPS 强制跳转（可选，如使用 HTTPS）────────────────────────────
# server {
#     listen  80;
#     server_name yourdomain.com;
#     return  301 https://$server_name$request_uri;
# }

# ── HTTPS upstream → RuoYi-Cpp 后端 ─────────────────────────────────────
server {
    listen       443 ssl http2;
    server_name  yourdomain.com;

    # SSL 证书（Let's Encrypt 或云服务商证书）
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── 前端（Vue history 模式）──────────────────────────────────────────
    # RuoYi-Cpp 内置 ./web 目录托管时使用；如用独立 Nginx 托管前端则删除此段
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_intercept_errors off;
        proxy_buffering off;
    }

    # ── 后端 API（/prod-api 前缀自动剥离转发）────────────────────────────
    location /prod-api/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket 实时通知 ─────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:18080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Actuator 健康检查（建议在内网/防火墙层限制访问）──────────────────
    location /actuator/ {
        proxy_pass http://127.0.0.1:18080/actuator/;
        proxy_set_header Host $host;
        # 放开内网访问即可，外网无需暴露
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ── 日志（可选）────────────────────────────────────────────────────
    access_log /var/log/nginx/ruoyi-cpp.access.log;
    error_log  /var/log/nginx/ruoyi-cpp.error.log;
}
