# watchdog 配置文件
# 复制到与 watchdog.exe 同目录，按需修改

exe             = ruoyi-cpp.exe
workdir         = .
args            = --config config.json
restart_delay   = 3
max_restarts    = 0
log_file        = watchdoglogs/watchdog.hjson
check_interval  = 1000
count           = 1
heartbeat_timeout = 10
max_log_size    = 10485760
max_log_files   = 5
